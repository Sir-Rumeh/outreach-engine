<div class="space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">System Error Logs</h1>
            <p class="text-sm text-slate-500 mt-0.5">Recorded pipeline exceptions and error telemetry from SQLite.</p>
        </div>
        <button onclick="loadErrorLogs()" class="px-4 py-2 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 text-xs font-semibold rounded-xl shadow-2xs transition-all flex items-center gap-2 cursor-pointer">
            <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            Refresh Logs
        </button>
    </div>

    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
        <div class="p-6 border-b border-slate-100 flex items-center justify-between">
            <div>
                <h3 class="font-bold text-slate-900 text-sm">Recorded Error Audit Table</h3>
                <p class="text-xs text-slate-400 mt-0.5">Detailed error messages and context logs captured during execution.</p>
            </div>
            <span class="px-2.5 py-1 rounded-full text-[11px] font-semibold bg-rose-50 text-rose-700 border border-rose-200">
                SQLite Audit Log
            </span>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-50/70 border-b border-slate-200 text-slate-400 text-[11px] uppercase tracking-wider font-semibold">
                        <th class="py-3 px-6"># ID</th>
                        <th class="py-3 px-6">Error Context</th>
                        <th class="py-3 px-6">Error Message</th>
                        <th class="py-3 px-6 text-right">Timestamp</th>
                    </tr>
                </thead>
                <tbody id="errorTableBody" class="divide-y divide-slate-100 text-sm text-slate-600">
                    <tr>
                        <td colspan="4" class="py-8 text-center text-slate-400 text-xs">Loading error logs...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
